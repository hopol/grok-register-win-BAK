<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inbox — liziai.cloud</title>
<!-- No external fonts: use system font stack for zero extra requests -->
<style>
/* ── Design Tokens (Linear-inspired, 4px grid) ── */
:root {
  --surface-base: #08090a;
  --surface-1: #0d0e10;
  --surface-2: #131417;
  --surface-3: #1a1b1f;
  --surface-hover: #1f2024;
  --border-subtle: #1e1f23;
  --border-default: #27282e;
  --border-strong: #34353c;
  --text-primary: #e8e9eb;
  --text-secondary: #9b9ca3;
  --text-tertiary: #626369;
  --text-quaternary: #3f4046;
  --accent: #5e6ad2;
  --accent-hover: #6b76de;
  --accent-subtle: rgba(94,106,210,0.12);
  --accent-border: rgba(94,106,210,0.25);
  --green: #4cb782;
  --green-subtle: rgba(76,183,130,0.10);
  --green-border: rgba(76,183,130,0.20);
  --red: #e5484d;
  --red-subtle: rgba(229,72,77,0.10);
  --yellow: #f5a623;
  --yellow-subtle: rgba(245,166,35,0.10);
  --blue: #3b82f6;
  --blue-subtle: rgba(59,130,246,0.10);
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow: 0 4px 12px rgba(0,0,0,0.5);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
  --transition: 140ms cubic-bezier(0.4, 0, 0.2, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: clip; }
body {
  font-family: var(--font-sans);
  background: var(--surface-base);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}
::selection { background: var(--accent-subtle); color: var(--text-primary); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* ── Layout ── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 240px;
  background: var(--surface-1);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform var(--transition);
  z-index: 50;
}
.sidebar-header {
  padding: 16px 12px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo {
  width: 28px; height: 28px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent), #7c87e8);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.logo svg { width: 16px; height: 16px; color: #fff; }
.sidebar-header .title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.sidebar-header .domain { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }

.sidebar-nav { flex: 1; padding: 4px 8px; overflow-y: auto; }
.nav-group { margin-bottom: 4px; }
.nav-group-label {
  padding: 16px 8px 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-quaternary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  transition: all var(--transition);
  user-select: none;
  position: relative;
}
.nav-item:hover { background: var(--surface-2); color: var(--text-primary); }
.nav-item.active { background: var(--surface-3); color: var(--text-primary); }
.nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-item .nav-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
}
.nav-item.active .nav-badge { color: var(--text-secondary); background: var(--surface-hover); }
.nav-shortcut {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-quaternary);
  font-family: var(--font-mono);
  padding: 1px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}

.sidebar-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.sidebar-footer .status-text { font-size: 11px; color: var(--text-tertiary); }
.sidebar-footer .last-sync { font-size: 11px; color: var(--text-quaternary); margin-left: auto; font-variant-numeric: tabular-nums; }

/* ── Admin login ── */
.auth-hidden { display: none !important; }
.login-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--surface-base);
}
.login-panel {
  width: min(380px, 100%);
  padding: 28px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  background: var(--surface-1);
  box-shadow: var(--shadow-lg);
}
.login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.login-brand .logo { width: 32px; height: 32px; }
.login-title { font-size: 17px; font-weight: 600; }
.login-domain { color: var(--text-tertiary); font-size: 12px; font-family: var(--font-mono); }
.login-label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 12px; font-weight: 500; }
.login-input {
  width: 100%;
  height: 38px;
  padding: 0 11px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  outline: none;
  background: var(--surface-base);
  color: var(--text-primary);
  font: 13px var(--font-mono);
}
.login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
.login-submit { width: 100%; justify-content: center; margin-top: 12px; height: 38px; }
.login-error { min-height: 18px; margin-top: 10px; color: var(--red); font-size: 12px; }

/* ── Mobile sidebar toggle ── */
.mobile-header {
  display: none;
  padding: 12px 16px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border-subtle);
  align-items: center;
  gap: 12px;
}
.mobile-toggle {
  width: 32px; height: 32px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
}
.mobile-toggle:hover { background: var(--surface-3); }
.mobile-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 49;
}
.mobile-backdrop.show { display: block; }

/* ── Main content ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

.content-header {
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-1);
  flex-shrink: 0;
}
.content-header h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }

.search-bar {
  flex: 1;
  max-width: 400px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  padding: 5px 10px;
  transition: border-color var(--transition);
}
.search-bar:focus-within { border-color: var(--accent-border); }
.search-bar svg { width: 14px; height: 14px; color: var(--text-tertiary); flex-shrink: 0; }
.search-bar input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font-sans);
}
.search-bar input::placeholder { color: var(--text-quaternary); }
.search-bar .kbd {
  font-size: 10px;
  color: var(--text-quaternary);
  font-family: var(--font-mono);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-default);
}

/* ── Domain chips ── */
.domain-chips { display: flex; gap: 4px; }
.chip {
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--surface-2);
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  white-space: nowrap;
}
.chip:hover { color: var(--text-secondary); border-color: var(--border-strong); }
.chip.active { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent-border); }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border-default);
  background: var(--surface-2);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); color: var(--text-primary); border-color: var(--border-strong); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:active { transform: translateY(0.5px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: var(--red-subtle); border-color: var(--red-subtle); color: var(--red); }
.btn-sm { padding: 3px 8px; font-size: 12px; }
.btn-icon { padding: 5px; }
.btn-icon svg { width: 14px; height: 14px; }

/* ── Stats row ── */
.stats-row {
  display: flex;
  gap: 1px;
  background: var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.stat {
  flex: 1;
  background: var(--surface-1);
  padding: 12px 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-label { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
.stat-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat-value.accent { color: var(--accent); }
.stat-value.green { color: var(--green); }

/* ── Email list ── */
.email-list { flex: 1; overflow-y: auto; }
.email-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background var(--transition);
  position: relative;
}
.email-item:hover { background: var(--surface-1); }
.email-item:hover .email-actions { opacity: 1; }
.email-avatar {
  width: 32px; height: 32px;
  border-radius: var(--radius);
  background: var(--surface-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  flex-shrink: 0;
  border: 1px solid var(--border-default);
}
.email-content { flex: 1; min-width: 0; }
.email-top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1px; }
.email-from {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}
.email-to {
  font-size: 11px;
  color: var(--text-quaternary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--font-mono);
}
.email-time {
  font-size: 11px;
  color: var(--text-tertiary);
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}
.email-subject {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 1px;
}
.email-preview {
  font-size: 12px;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.otp-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--green-subtle);
  color: var(--green);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  border: 1px solid var(--green-border);
  flex-shrink: 0;
}
.otp-badge svg { width: 10px; height: 10px; }
.email-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--transition);
  flex-shrink: 0;
  align-self: center;
}

/* ── Skeleton loading ── */
.skeleton {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-subtle);
}
.skeleton-avatar {
  width: 32px; height: 32px;
  border-radius: var(--radius);
  background: var(--surface-2);
  flex-shrink: 0;
}
.skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.skeleton-line {
  height: 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
.skeleton-line.short { width: 40%; }
.skeleton-line.medium { width: 65%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  text-align: center;
}
.empty-state .empty-icon {
  width: 48px; height: 48px;
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  border: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.empty-state .empty-icon svg { width: 24px; height: 24px; color: var(--text-quaternary); }
.empty-state .empty-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty-state .empty-desc { font-size: 13px; color: var(--text-tertiary); max-width: 320px; }

/* ── Detail panel ── */
.detail-panel {
  position: fixed;
  top: 0; right: 0;
  width: 540px;
  max-width: 100vw;
  height: 100vh;
  background: var(--surface-1);
  border-left: 1px solid var(--border-default);
  z-index: 100;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 200ms cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: var(--shadow-lg);
}
.detail-panel.open { transform: translateX(0); }
.detail-header {
  height: 52px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.detail-header h3 { font-size: 14px; font-weight: 600; }
.detail-content { flex: 1; overflow-y: auto; padding: 20px; }

.detail-subject {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 16px;
  line-height: 1.4;
}
.detail-otp-card {
  background: var(--green-subtle);
  border: 1px solid var(--green-border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.detail-otp-card .otp-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--green);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.detail-otp-card .otp-code {
  font-size: 32px;
  font-weight: 700;
  color: var(--green);
  font-family: var(--font-mono);
  letter-spacing: 6px;
  line-height: 1;
}
.detail-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--surface-2);
  border-radius: var(--radius);
  border: 1px solid var(--border-subtle);
}
.detail-meta-row { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
.detail-meta-label { color: var(--text-tertiary); min-width: 50px; font-weight: 500; flex-shrink: 0; }
.detail-meta-value { color: var(--text-secondary); word-break: break-all; }
.detail-meta-value.mono { font-family: var(--font-mono); font-size: 12px; }
.detail-body {
  background: var(--surface-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 0;
  font-size: 13px;
  max-height: 500px;
  overflow-y: auto;
  line-height: 1.65;
  color: var(--text-secondary);
  position: relative;
}
.detail-body-pre {
  padding: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--font-mono);
  font-size: 12px;
}

/* ── Mailbox list ── */
.mailbox-list { padding: 4px 0; }
.mailbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  transition: background var(--transition);
  border-bottom: 1px solid var(--border-subtle);
}
.mailbox-row:hover { background: var(--surface-1); }
.mailbox-row .mb-avatar {
  width: 32px; height: 32px;
  border-radius: var(--radius);
  background: var(--surface-3);
  border: 1px solid var(--border-default);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.mailbox-row .mb-avatar svg { width: 14px; height: 14px; color: var(--text-tertiary); }
.mailbox-row .mb-addr {
  flex: 1;
  font-size: 13px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mailbox-row .mb-otp {
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
  font-family: var(--font-mono);
  background: var(--green-subtle);
  border: 1px solid var(--green-border);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
}
.mailbox-row .mb-count { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.mailbox-row .mb-time { font-size: 11px; color: var(--text-quaternary); font-variant-numeric: tabular-nums; }

/* ── Create view ── */
.create-view { padding: 32px 20px; max-width: 440px; }
.create-view h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.create-view .create-desc { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
.form-field { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.form-input, .form-select {
  width: 100%;
  padding: 8px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color var(--transition);
}
.form-input:focus, .form-select:focus { border-color: var(--accent-border); }
.form-select { cursor: pointer; }
.create-results { margin-top: 20px; display: flex; flex-direction: column; gap: 6px; }
.create-result-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
}
.create-result-row .email-addr {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Toast ── */

// ── API helpers ──
function apiHeaders() {

async function api(path, opts = {}) {

async function authenticateAdmin(token, remember) {
  const value = String(token || "").trim();
  if (!value) throw new Error("Management key is required");
  const r = await fetch("/admin/all?limit=100&login=" + Date.now(), {
    cache: "no-store",
    headers: { "X-Admin-Token": value, "Authorization": "Bearer " + value, "Accept": "application/json" }
  });
  if (!r.ok) throw new Error(r.status === 401 ? "Invalid management key" : r.status + " " + r.statusText);
  const data = await r.json();
  adminToken = value;
  if (remember) sessionStorage.setItem("tempmail_admin_token", value);
  document.getElementById("login-screen").classList.add("auth-hidden");
  document.getElementById("app-shell").classList.remove("auth-hidden");
  document.getElementById("login-error").textContent = "";
  allEmails = data.messages || [];
  renderData();
  document.getElementById("last-sync").textContent = new Date().toLocaleTimeString("en-US", { hour:"2-digit", minute:"2-digit", hour12: false });
  document.getElementById("status-text").textContent = "Connected";
}

function logoutAdmin(showLogin = true) {

  allEmails = [];
  sessionStorage.removeItem("tempmail_admin_token");
  document.getElementById("app-shell").classList.add("auth-hidden");

    document.getElementById("login-screen").classList.remove("auth-hidden");

}

async function initializeAdmin() {

  if (!stored) return;
  try {
    await authenticateAdmin(stored, true);
  } catch(e) {
    logoutAdmin(true);
  }
}

// ── Toast ──
function showToast(msg, type = "info") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = "toast";
  const iconSvg = type === "success"
    ? '<svg class="toast-icon green" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : type === "error"
    ? '<svg class="toast-icon red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>'
    : '';

  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add("removing");
    setTimeout(() => toast.remove(), 150);
  }, 2500);
}

// ── Utils ──
function formatTime(ts) {
  if (!ts) return "--";
  let d;
  if (typeof ts === "number") d = ts > 1e12 ? new Date(ts) : new Date(ts * 1000);
  else d = new Date(ts);
  if (isNaN(d)) return String(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "now";
  if (diff < 3600) return Math.floor(diff/60) + "m";
  if (diff < 86400) return Math.floor(diff/3600) + "h";
  if (diff < 604800) return Math.floor(diff/86400) + "d";
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}

function formatTimeFull(ts) {
  if (!ts) return "--";
  let d;
  if (typeof ts === "number") d = ts > 1e12 ? new Date(ts) : new Date(ts * 1000);
  else d = new Date(ts);
  if (isNaN(d)) return String(ts);
  return d.toLocaleString("en-US", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

function getOTP(msg) {
  if (msg.extracted_json) {
    try {
      const arr = JSON.parse(msg.extracted_json);
      if (Array.isArray(arr) && arr.length > 0 && arr[0].value) return arr[0].value;
    } catch(e) {}
  }
  const body = msg.body || msg.bodyPreview || msg.raw_text || "";
  const subject = msg.subject || "";
  return extractOTP(body, subject);
}

// ── OTP extraction (mirrors Python mail_otp.py logic) ──
function decodeQuotedPrintable(text) {
  if (!text) return "";
  // Remove soft line breaks: =\n or =\r\n
  text = text.replace(/=\r?\n/g, "");
  // Decode hex sequences =XX
  text = text.replace(/=([0-9A-Fa-f]{2})/g, (_, hex) => {
    try { return String.fromCharCode(parseInt(hex, 16)); }
    catch(e) { return ""; }
  });
  return text;
}

function stripHTML(html) {
  if (!html) return "";
  // Remove HTML comments (including MSO conditionals)
  html = html.replace(/<!--[\s\S]*?-->/g, "");
  // Remove style and script tags entirely
  html = html.replace(/<style[\s\S]*?<\/style>/gi, "");
  html = html.replace(/<script[\s\S]*?<\/script>/gi, "");
  // Remove all HTML tags
  html = html.replace(/<[^>]+>/g, " ");
  // Decode common HTML entities
  html = html.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  html = html.replace(/&nbsp;/g, " ").replace(/&quot;/g, '"').replace(/&#039;/g, "'");
  html = html.replace(/&#(\d+);/g, (_, n) => { try { return String.fromCharCode(parseInt(n)); } catch(e) { return ""; } });
  // Collapse whitespace
  html = html.replace(/\s+/g, " ").trim();
  return html;
}

function stripEmailHeaders(rawBody) {
  if (!rawBody) return "";
  // Find the first blank line (\n\n or \r\n\r\n) that separates MIME headers from body
  const sep1 = rawBody.indexOf("\r\n\r\n");
  const sep2 = rawBody.indexOf("\n\n");
  let sep = -1;
  if (sep1 >= 0 && sep2 >= 0) sep = Math.min(sep1, sep2);
  else if (sep1 >= 0) sep = sep1;
  else if (sep2 >= 0) sep = sep2;
  if (sep >= 0) return rawBody.substring(sep + 2).replace(/^\r?\n/, "");
  return rawBody;
}

function extractOTP(rawBody, subject) {
  if (!rawBody) return "";

  // Step 0: Strip email headers — only keep the MIME body part
  let bodyOnly = stripEmailHeaders(rawBody);

  // Step 1: Decode quoted-printable
  let decoded = decodeQuotedPrintable(bodyOnly);

  // Step 2: Try to find OTP directly in decoded HTML using high-confidence patterns
  // Pattern: <p style="...font-size..."> digits </p> (OpenAI email format)
  const pTagMatch = decoded.match(/<p[^>]*font-size[^>]*>\s*(\d{6})\s*<\/p>/i);
  if (pTagMatch) return pTagMatch[1];

  // Pattern: digits between closing tag and newline/whitespace (standalone code in a block)
  const blockMatch = decoded.match(/<(?:p|div|span|td)[^>]*>\s*(\d{6})\s*<\//i);
  if (blockMatch) return blockMatch[1];

  // Step 3: Strip HTML to get plain text
  let text = stripHTML(decoded);
  const fullText = (subject || "") + " \n " + text;

  // Step 4: Score-based extraction (mirrors Python _extract_otp_from_text)
  const OTP_RE = /(^|[^0-9])([0-9]{6})([^0-9]|$)/g;
  const OTP_CONTEXT = ["code", "verification", "verify", "openai", "chatgpt", "login", "otp", "passcode", "one-time", "\u9a8c\u8bc1\u7801", "\u9a57\u8b49\u78bc"];
  const FAKE_CONTEXT = ["tracking", "track id", "message id", "ticket", "utm", "unsubscribe", "pixel", "color", "background", "border", "font-size", "padding", "margin", "radius", "hex", "rgb", "rgba", "received", "arc-", "dkim", "spf", "content-type", "mime", "boundary", "for <", "m=+", "timestamp", "message-id"];
  const STOPWORDS = ["your", "is", "use", "enter", "sign", "temporary", "code"];

  const candidates = [];
  let match;
  while ((match = OTP_RE.exec(fullText)) !== null) {
    const code = match[2];
    const start = match.index + match[1].length;
    const end = start + 6;

    // Skip numbers that are part of an email address
    const around = fullText.substring(Math.max(0, start - 3), Math.min(fullText.length, end + 3));
    if (/[a-z0-9._%+-]\.?\d{6}@|@.*\d{6}[a-z0-9._-]/i.test(around)) continue;
    // Skip if preceded by a hex-ish or alnum char (part of a longer token like email addr)
    const charBefore = fullText[start - 1];
    const charAfter = fullText[end];
    if (charBefore && /[a-fA-F0-9-]/.test(charBefore)) continue;
    if (charAfter && /[a-fA-F0-9-]/.test(charAfter)) continue;

    const context = fullText.substring(Math.max(0, start - 80), Math.min(fullText.length, end + 80));
    const contextLc = context.toLowerCase();
    const beforeContext = fullText.substring(Math.max(0, start - 60), start).toLowerCase();

    // Skip if near fake context markers (and no OTP context markers)
    if (FAKE_CONTEXT.some(m => beforeContext.includes(m)) && !OTP_CONTEXT.some(m => beforeContext.includes(m))) continue;
    if (FAKE_CONTEXT.some(m => contextLc.includes(m)) && !OTP_CONTEXT.some(m => contextLc.includes(m))) continue;

    // Skip CSS color values: #XXXXXX
    if (fullText.substring(Math.max(0, start - 1), end).startsWith("#")) continue;

    // Skip if preceded by CSS property pattern
    if (/(?:color|background|border|rgb|rgba|font)[^\n]{0,20}#?/.test(context) && !OTP_CONTEXT.some(m => contextLc.includes(m))) continue;

    // Score the candidate
    let score = 0;
    if (OTP_CONTEXT.some(k => contextLc.includes(k))) score += 10;
    if (STOPWORDS.some(k => contextLc.includes(k))) score += 2;
    const before = fullText.substring(Math.max(0, start - 2), start);
    const after = fullText.substring(end, end + 2);
    if (before.trim() || after.trim()) score += 1;

    candidates.push({ score, start, code });
  }

  if (candidates.length === 0) return "";
  candidates.sort((a, b) => b.score - a.score || a.start - b.start);
  return candidates[0].code;
}

function getInitials(email) {
  if (!email) return "??";
  const name = email.split("@")[0];
  return name.substring(0, 2).toUpperCase();
}

function getTimestamp(m) {
  const ts = m.received_at || m.receivedDateTime;
  if (typeof ts === "number") return ts > 1e12 ? ts : ts * 1000;
  return new Date(ts).getTime() || 0;
}

function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

// ── Email body decoding (frontend) ──
function feDecodeBytes(bytes, charset) {
  try {
    return new TextDecoder((charset || "utf-8").toLowerCase()).decode(new Uint8Array(bytes));
  } catch(e) {
    return new TextDecoder("utf-8").decode(new Uint8Array(bytes));
  }
}

function feStringToBytes(text) {
  const bytes = [];
  for (const ch of String(text || "")) {
    const code = ch.codePointAt(0);
    if (code <= 255) bytes.push(code);
    else bytes.push(...new TextEncoder().encode(ch));
  }
  return bytes;
}

function feDecodeQP(text) {
  if (!text) return "";
  text = text.replace(/=\r?\n/g, "");
  const bytes = [];
  for (let i = 0; i < text.length; i++) {
    if (text.charAt(i) === "=" && /^[0-9A-Fa-f]{2}$/.test(text.substring(i + 1, i + 3))) {
      bytes.push(parseInt(text.substring(i + 1, i + 3), 16));
      i += 2;
      continue;
    }
    bytes.push(...feStringToBytes(text.charAt(i)));
  }
  return feDecodeBytes(bytes, "utf-8");
}

function feDecodeBase64(text, charset) {
  try {
    const binary = atob(String(text || "").replace(/\s+/g, ""));
    const bytes = [];
    for (let i = 0; i < binary.length; i++) bytes.push(binary.charCodeAt(i));
    return feDecodeBytes(bytes, charset || "utf-8");
  } catch(e) {
    return String(text || "");
  }
}

function feDecodeMimeHeader(value) {
  const input = String(value || "");
  if (!input.includes("=?")) return input;
  return input.replace(/=\?([^?]+)\?([bBqQ])\?([^?]*)\?=/g, function(_, charset, encoding, payload) {
    if (encoding.toUpperCase() === "B") return feDecodeBase64(payload, charset);
    const q = payload.replace(/_/g, " ");
    const bytes = [];
    for (let i = 0; i < q.length; i++) {
      if (q.charAt(i) === "=" && /^[0-9A-Fa-f]{2}$/.test(q.substring(i + 1, i + 3))) {
        bytes.push(parseInt(q.substring(i + 1, i + 3), 16));
        i += 2;
      } else {
        bytes.push(...feStringToBytes(q.charAt(i)));
      }
    }
    return feDecodeBytes(bytes, charset);
  }).replace(/\s+/g, " ").trim();
}

function feStripHeaders(raw) {
  if (!raw) return "";
  var s1 = raw.indexOf("\r\n\r\n");
  var s2 = raw.indexOf("\n\n");
  var sep = -1;
  if (s1 >= 0 && s2 >= 0) sep = Math.min(s1, s2);
  else if (s1 >= 0) sep = s1;
  else if (s2 >= 0) sep = s2;
  if (sep >= 0) {
    var rest = raw.substring(sep + 2);
    if (rest.charAt(0) === "\n") rest = rest.substring(1);
    else if (rest.charAt(0) === "\r" && rest.charAt(1) === "\n") rest = rest.substring(2);
    return rest;
  }
  return raw;
}

function feBodyToText(rawBody) {
  if (!rawBody) return "(empty)";
  const raw = String(rawBody);
  var body = feStripHeaders(rawBody);
  const transferEncoding = (/^content-transfer-encoding:\s*([^\r\n]+)/im.exec(raw) || [])[1] || "";
  const charset = (/charset=["']?([^;"'\s]+)/i.exec(raw) || [])[1] || "utf-8";
  var decoded = /base64/i.test(transferEncoding) ? feDecodeBase64(body, charset) : feDecodeQP(body);
  // Strip HTML tags for plain text display
  decoded = decoded.replace(/<!--[\s\S]*?-->/g, "");
  decoded = decoded.replace(/<style[\s\S]*?<\/style>/gi, "");
  decoded = decoded.replace(/<script[\s\S]*?<\/script>/gi, "");
  decoded = decoded.replace(/<[^>]+>/g, " ");
  decoded = decoded.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  decoded = decoded.replace(/&nbsp;/g, " ").replace(/&quot;/g, '"').replace(/&#039;/g, "'");
  decoded = decoded.replace(/&#(\d+);/g, function(_, n) { try { return String.fromCharCode(parseInt(n)); } catch(e) { return ""; } });

}

function feMessagePreview(msg) {
  const otp = getOTP(msg);
  if (otp) return "Verification code: " + otp;
  const raw = msg.body || msg.raw_text || msg.bodyPreview || "";
  const text = feBodyToText(raw);
  if (!text || text === "(empty)" || /^(received|arc-|dkim-signature|authentication-results|content-type):/i.test(text)) {
    return "Open to view message";
  }
  return text;
}

// ── Data loading ──
async function refreshData() {
  if (isLoading || !adminToken) return;
  isLoading = true;
  document.getElementById("status-text").textContent = "Syncing...";
  try {
    const data = await api("/admin/all?limit=100");
    allEmails = data.messages || [];
    renderData();
    document.getElementById("last-sync").textContent = new Date().toLocaleTimeString("en-US", { hour:"2-digit", minute:"2-digit", hour12: false });
    document.getElementById("status-text").textContent = "Connected";
  } catch(e) {
    console.error("refresh error:", e);
    document.getElementById("status-text").textContent = "Error";
    showToast("Failed to load: " + e.message, "error");
  }
  isLoading = false;
}

function renderData() {
  const otpEmails = allEmails.filter(m => getOTP(m));
  const oneHourAgo = Date.now() - 3600000;
  const recent = allEmails.filter(m => getTimestamp(m) > oneHourAgo);
  const mailboxSet = new Set(allEmails.map(m => m.to_address).filter(Boolean));

  document.getElementById("stat-total").textContent = allEmails.length;
  document.getElementById("stat-otp").textContent = otpEmails.length;
  document.getElementById("stat-mailboxes").textContent = mailboxSet.size;
  document.getElementById("stat-recent").textContent = recent.length;
  document.getElementById("nav-inbox-count").textContent = allEmails.length;
  document.getElementById("nav-otp-count").textContent = otpEmails.length;
  document.getElementById("nav-mailbox-count").textContent = mailboxSet.size;

  renderList();
}

// ── Rendering ──
function renderList() {
  if (currentView === "create") { renderCreateView(); return; }
  if (currentView === "mailboxes") { renderMailboxList(); return; }

  let emails = [...allEmails];

  if (currentView === "otp") emails = emails.filter(m => getOTP(m));

  if (domainFilter) emails = emails.filter(m => (m.to_address || "").endsWith("@" + domainFilter));

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    emails = emails.filter(m =>
      (m.to_address || "").toLowerCase().includes(q) ||
      (m.from_address || "").toLowerCase().includes(q) ||
      feDecodeMimeHeader(m.subject || "").toLowerCase().includes(q) ||
      (m.body || m.bodyPreview || m.raw_text || "").toLowerCase().includes(q)
    );
  }

  const container = document.getElementById("email-list");

  if (emails.length === 0) {
    const titles = { inbox: "No mail yet", otp: "No OTP codes found", mailboxes: "No addresses" };
    const descs = {
      inbox: searchQuery ? "Try a different search term." : "Incoming mail will appear here automatically.",
      otp: "Verification codes will show up here when received.",
      mailboxes: "Create a new address to get started."
    };
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>' +
        '<div class="empty-title">' + (titles[currentView] || "Nothing here") + '</div>' +
        '<div class="empty-desc">' + (descs[currentView] || "") + '</div>' +
      '</div>';
    return;
  }

  container.innerHTML = emails.map(m => {
    const otp = getOTP(m);
    const subject = feDecodeMimeHeader(m.subject || "(no subject)");
    const preview = feMessagePreview(m).substring(0, 120).replace(/\n/g, " ").trim();
    const initials = getInitials(m.from_address || m.to_address);
    return '<div class="email-item" onclick="showDetail(\''+ m.id +'\')">' +
      '<div class="email-avatar">' + escapeHtml(initials) + '</div>' +
      '<div class="email-content">' +
        '<div class="email-top-row">' +
          '<span class="email-from">' + escapeHtml(m.from_address || "Unknown") + '</span>' +
          '<span class="email-to">' + escapeHtml(m.to_address || "") + '</span>' +
          (otp ? '<span class="otp-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>' + otp + '</span>' : '') +
          '<span class="email-time">' + formatTime(m.received_at || m.receivedDateTime) + '</span>' +
        '</div>' +
        '<div class="email-subject">' + escapeHtml(subject) + '</div>' +
        '<div class="email-preview">' + escapeHtml(preview) + '</div>' +
      '</div>' +
      '<div class="email-actions">' +
        '<button class="btn btn-ghost btn-icon btn-sm btn-danger" onclick="event.stopPropagation();deleteMessage(\''+ m.id +'\',\''+ (m.to_address||"").replace(/'/g,"") +'\')" title="Delete">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

function renderMailboxList() {
  const container = document.getElementById("email-list");
  const mailboxMap = new Map();

  allEmails.forEach(m => {
    const addr = m.to_address || "";
    if (!mailboxMap.has(addr)) mailboxMap.set(addr, { addr, count: 0, latestOTP: "", latestTime: 0 });
    const mb = mailboxMap.get(addr);
    mb.count++;
    const otp = getOTP(m);
    const t = getTimestamp(m);
    if (otp && t > mb.latestTime) { mb.latestOTP = otp; mb.latestTime = t; }
  });

  let mailboxes = Array.from(mailboxMap.values());
  if (domainFilter) mailboxes = mailboxes.filter(mb => mb.addr.endsWith("@" + domainFilter));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    mailboxes = mailboxes.filter(mb => mb.addr.toLowerCase().includes(q));
  }
  mailboxes.sort((a,b) => b.latestTime - a.latestTime);

  if (mailboxes.length === 0) {
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg></div>' +
        '<div class="empty-title">No addresses</div>' +
        '<div class="empty-desc">Create a new address to get started.</div>' +
      '</div>';
    return;
  }

  container.innerHTML = '<div class="mailbox-list">' +
    mailboxes.map(mb =>
      '<div class="mailbox-row" onclick="filterByMailbox(\''+ mb.addr.replace(/'/g,"") +'\')">' +
        '<div class="mb-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg></div>' +
        '<span class="mb-addr">' + escapeHtml(mb.addr) + '</span>' +
        (mb.latestOTP ? '<span class="mb-otp">' + mb.latestOTP + '</span>' : '') +
        '<span class="mb-count">' + mb.count + ' msg</span>' +
        '<span class="mb-time">' + (mb.latestTime ? formatTime(mb.latestTime) : "") + '</span>' +
      '</div>'
    ).join("") +
  '</div>';
}

function renderCreateView() {
  const container = document.getElementById("email-list");
  container.innerHTML =
    '<div class="create-view">' +
      '<h3>New Address</h3>' +
      '<div class="create-desc">Generate a temporary email address on your domain.</div>' +
      '<div class="form-field">' +
        '<label class="form-label">Domain</label>' +
        '<select class="form-select" id="create-domain">' +
          '<option value="liziai.cloud">liziai.cloud</option>' +
          '<option value="edu.liziai.cloud">edu.liziai.cloud</option>' +
        '</select>' +
      '</div>' +
      '<div class="form-field">' +
        '<label class="form-label">Count</label>' +
        '<input type="number" class="form-input" id="create-count" value="1" min="1" max="50">' +
      '</div>' +
      '<button class="btn btn-primary" onclick="createMailboxes()" style="width:100%;justify-content:center;padding:8px;">Generate Address</button>' +
      '<div class="create-results" id="create-result"></div>' +
    '</div>';
}

async function createMailboxes() {
  const domain = document.getElementById("create-domain").value;
  const count = parseInt(document.getElementById("create-count").value || "1");
  const resultDiv = document.getElementById("create-result");
  resultDiv.innerHTML = '<div style="display:flex;justify-content:center;padding:12px;"><div class="skeleton-line" style="width:60%;height:14px;"></div></div>';
  try {
    const data = await api("/api/mailboxes", {
      method: "POST",
      headers: { ...apiHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ domain, count })
    });
    const emails = data.emails || [];
    resultDiv.innerHTML = emails.map(e =>
      '<div class="create-result-row">' +
        '<span class="email-addr">' + escapeHtml(e) + '</span>' +
        '<button class="btn btn-sm btn-ghost" onclick="copyText(\''+ e.replace(/'/g,"") +'\')">Copy</button>' +
      '</div>'
    ).join("");
    showToast("Created " + emails.length + " address" + (emails.length > 1 ? "es" : ""), "success");
  } catch(e) {
    resultDiv.innerHTML = '<div style="color:var(--red);font-size:13px;padding:8px;">Failed: ' + escapeHtml(e.message) + '</div>';
    showToast("Failed to create", "error");
  }
}

// ── Detail ──
async function showDetail(msgId) {
  const msg = allEmails.find(m => m.id === msgId);
  if (!msg) return;
  const otp = getOTP(msg);
  const content = document.getElementById("detail-content");
  content.innerHTML =
    '<div class="detail-subject">' + escapeHtml(feDecodeMimeHeader(msg.subject || "(no subject)")) + '</div>' +
    (otp ? '<div class="detail-otp-card"><div><div class="otp-label">Verification Code</div><div class="otp-code">' + otp + '</div></div><button class="btn btn-sm" style="margin-left:auto;" onclick="copyText(\''+ otp +'\')">Copy</button></div>' : '') +
    '<div class="detail-meta">' +
      '<div class="detail-meta-row"><span class="detail-meta-label">From</span><span class="detail-meta-value">' + escapeHtml(msg.from_address || "Unknown") + '</span></div>' +
      '<div class="detail-meta-row"><span class="detail-meta-label">To</span><span class="detail-meta-value mono">' + escapeHtml(msg.to_address || "") + '</span></div>' +
      '<div class="detail-meta-row"><span class="detail-meta-label">Time</span><span class="detail-meta-value">' + formatTimeFull(msg.received_at || msg.receivedDateTime) + '</span></div>' +
      '<div class="detail-meta-row"><span class="detail-meta-label">ID</span><span class="detail-meta-value mono">' + escapeHtml(msg.id || msg.message_id || "") + '</span></div>' +
    '</div>' +
    '<div class="detail-body" id="detail-body-container"><div class="detail-body-pre" style="color:var(--text-tertiary);">Loading...</div></div>';
  document.getElementById("detail-panel").classList.add("open");

  // Lazy-load full message body
  try {
    const fullMsg = await api("/admin/msg?id=" + encodeURIComponent(msgId) + "&email=" + encodeURIComponent(msg.to_address || ""));
    const body = (fullMsg.message && (fullMsg.message.body || fullMsg.message.raw_text)) || msg.bodyPreview || "";
    var text = feBodyToText(body);
    document.getElementById("detail-body-container").innerHTML = '<div class="detail-body-pre">' + escapeHtml(text) + '</div>';
  } catch(e) {
    var text = feBodyToText(msg.bodyPreview || "");
    document.getElementById("detail-body-container").innerHTML = '<div class="detail-body-pre">' + escapeHtml(text) + '</div>';
  }
}

function closeDetail() {
  document.getElementById("detail-panel").classList.remove("open");
}

// ── Actions ──
async function deleteMessage(msgId, emailAddr) {
  if (!confirm("Delete this message?")) return;
  try {
    await api("/admin/delete?id=" + encodeURIComponent(msgId) + "&email=" + encodeURIComponent(emailAddr), { method: "DELETE" });
    allEmails = allEmails.filter(m => m.id !== msgId);
    renderData();
    showToast("Message deleted", "success");
    closeDetail();
  } catch(e) {
    showToast("Delete failed", "error");
  }
}

function filterByMailbox(addr) {
  document.getElementById("search-input").value = addr;
  searchQuery = addr;
  switchView("inbox");
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast("Copied: " + text, "success"));
}

// ── Navigation ──
function switchView(view) {
  currentView = view;
  document.querySelectorAll(".nav-item[data-view]").forEach(n => n.classList.remove("active"));
  const navEl = document.querySelector('[data-view="' + view + '"]');
  if (navEl) navEl.classList.add("active");
  const titles = { inbox: "All Mail", otp: "OTP Codes", mailboxes: "Addresses", create: "New Address" };
  document.getElementById("page-title").textContent = titles[view] || "All Mail";
  renderList();
  if (window.innerWidth <= 768) toggleSidebar(false);
}

function toggleSidebar(force) {
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("mobile-backdrop");
  const open = force !== undefined ? force : !sidebar.classList.contains("open");
  sidebar.classList.toggle("open", open);
  backdrop.classList.toggle("show", open);
}

// ── Event listeners ──
document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => {
    const view = item.dataset.view;
    const action = item.dataset.action;
    if (action === "refresh") { refreshData(); return; }
    if (view) switchView(view);
  });
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    domainFilter = chip.dataset.domain;
    renderList();
  });
});

document.getElementById("search-input").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderList();
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = document.getElementById("login-submit");
  const error = document.getElementById("login-error");
  button.disabled = true;
  button.textContent = "Signing in...";
  error.textContent = "";
  try {
    await authenticateAdmin(document.getElementById("admin-token-input").value, true);
  } catch(err) {
    error.textContent = err.message || "Sign in failed";
  } finally {
    button.disabled = false;
    button.textContent = "Sign in";
  }
});

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "/") { e.preventDefault(); document.getElementById("search-input").focus(); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); refreshData(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); switchView("create"); }
  else if (e.key === "1") { e.preventDefault(); switchView("inbox"); }
  else if (e.key === "2") { e.preventDefault(); switchView("otp"); }
  else if (e.key === "3") { e.preventDefault(); switchView("mailboxes"); }
  else if (e.key === "Escape") closeDetail();
});

// Auto refresh
setInterval(refreshData, 30000);

// Initial authentication
initializeAdmin();
</script>
